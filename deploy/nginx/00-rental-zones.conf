# Đặt ở /etc/nginx/conf.d/00-rental-zones.conf (ngữ cảnh http, nạp trước hai file site).
# Hướng dẫn: docs/deployment/huong-dan-trien-khai.md (mục 5 và mục 5a)

# Không lộ phiên bản nginx trong header và trang lỗi.
server_tokens off;
# Giải phóng ngay socket của kết nối đã quá hạn thay vì giữ ở trạng thái đóng dở.
reset_timedout_connection on;

# ---------------------------------------------------------------------------------------------------------------
# 1. Khóa giới hạn theo IP khách
# ---------------------------------------------------------------------------------------------------------------
# Loopback để trống = không bị giới hạn (kiểm tra sức khỏe, thao tác trên chính máy chủ).
# QUAN TRỌNG khi máy chủ nằm sau NAT: `$remote_addr` phải là IP thật của khách. Nếu thiết bị NAT thay IP nguồn bằng IP
# của chính nó thì mọi người dùng chung MỘT khóa ở đây, và fail2ban sẽ khóa nhầm cả IP của thiết bị NAT. Kiểm trước khi
# mở cổng (mục 5a của hướng dẫn).
# Nếu container FE gọi API qua địa chỉ công khai thì mọi lượt render phía server cũng mang IP của máy chủ và dồn vào
# một khóa: cho FE gọi thẳng `http://api:3000` qua mạng rental_edge (xem hướng dẫn cho FE).
map $remote_addr $rental_limit_key {
    default    $binary_remote_addr;
    127.0.0.1  "";
    ::1        "";
}

# Lớp chặn thứ nhất, trước khi tới Node. Ứng dụng vẫn có giới hạn riêng theo từng route (spec 0002), nên số ở đây
# chỉ cần đủ chặt để một IP không tạo được lưu lượng lớn, không cần khớp từng nhóm.
limit_req_zone  $rental_limit_key zone=rental_auth:10m  rate=30r/m;   # đăng nhập, đăng ký, quên và đặt lại mật khẩu
limit_req_zone  $rental_limit_key zone=rental_api:10m   rate=10r/s;   # phần còn lại của API
limit_req_zone  $rental_limit_key zone=rental_page:10m  rate=8r/s;    # trang FE (render phía server, tốn CPU của FE)
limit_req_zone  $rental_limit_key zone=rental_img:10m   rate=5r/s;    # /_next/image (bộ tối ưu ảnh của Next.js, tốn CPU)
limit_req_zone  $rental_limit_key zone=rental_asset:10m rate=30r/s;   # tệp tĩnh /_next/static (rẻ, nhưng một trang nạp hàng chục tệp)
limit_conn_zone $rental_limit_key zone=rental_conn:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# ---------------------------------------------------------------------------------------------------------------
# 2. Nhận diện bot quét: đóng kết nối ngay (444) trước khi tới Node, và ghi vào nhật ký riêng cho fail2ban
# ---------------------------------------------------------------------------------------------------------------
# Phương thức lạ (TRACE, CONNECT, PROPFIND...): API chỉ dùng sáu phương thức này.
map $request_method $rental_bad_method {
    default                                      1;
    ~^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$  0;
}

# User-Agent rỗng, hoặc của công cụ quét lỗ hổng. Cố ý KHÔNG chặn curl, python-requests, Go-http-client...: dịch vụ
# giám sát và việc tự kiểm tra của bạn dùng chúng.
map $http_user_agent $rental_bad_ua {
    default  0;
    ""       1;
    ~*(sqlmap|nikto|nmap|masscan|zgrab|nessus|acunetix|havij|dirbuster|gobuster|wpscan|nuclei|openvas|netsparker|jaeles|zmap) 1;
}

# Đường dẫn mà FE và API này không bao giờ có: tệp hoặc thư mục ẩn ở bất kỳ cấp nào (/.env, /api/.git/config; trừ .well-known), đuôi tệp script, sao lưu và cấu hình, và các
# đường dẫn của WordPress, phpMyAdmin, Spring, Exchange, Jenkins... mà bot dò. `$uri` đã giải mã và chuẩn hóa.
# Nếu FE của bạn thật sự có một đường dẫn trùng mẫu dưới đây, sửa mẫu ở đây rồi nạp lại nginx.
map $uri $rental_bad_path {
    default  0;
    ~(^|/)\.(?!well-known(/|$))  1;
    ~*\.(php[0-9]?|phtml|asp|aspx|jsp|jspx|cgi|pl|py|rb|sh|exe|dll|bak|old|orig|save|swp|sql|sqlite|db|ini|conf|cfg|log|yml|yaml|toml|pem|key|tar|tgz|gz|zip|rar|7z)$  1;
    ~*^/(wp-|wordpress|xmlrpc|phpmyadmin|pma/|myadmin|adminer|phpinfo|cgi-bin|vendor/|actuator|boaform|hnap1|owa/|ecp/|autodiscover|solr/|jenkins|manager/html|geoserver|struts|telescope|_profiler|server-status|config\.json|setup\.php)  1;
}

# Gộp ba tín hiệu: "000" là sạch, còn lại bị chặn.
map "$rental_bad_method$rental_bad_ua$rental_bad_path" $rental_block {
    "000"    0;
    default  1;
}

# Điều kiện ghi nhật ký (`access_log ... if=`): yêu cầu bị chặn vào rental.blocked.log, còn lại vào rental.access.log.
# Tách ra để nhiễu của bot không lấp nhật ký thật, và để fail2ban đọc đúng từng loại.
map $rental_block $rental_log_blocked { 0 0; default 1; }
map $rental_block $rental_log_normal  { 0 1; default 0; }

# ---------------------------------------------------------------------------------------------------------------
# 3. Nhật ký
# ---------------------------------------------------------------------------------------------------------------
# Nhật ký truy cập KHÔNG ghi query string và Referer: liên kết đặt lại mật khẩu mang `?token=...` và trình duyệt
# gửi nó lại trong Referer; ghi ra log là để lộ token ở chỗ nhiều người đọc được. `$uri` là đường dẫn đã bỏ query.
# Định dạng này được các bộ lọc fail2ban ở deploy/fail2ban/filter.d dựa vào: đổi ở đây thì phải đổi ở đó.
log_format rental '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent $request_time "$http_user_agent"';
