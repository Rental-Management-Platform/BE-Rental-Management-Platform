# Đặt ở /etc/nginx/snippets/rental-proxy-web.conf. Dùng chung cho mọi location chuyển vào FE.

proxy_pass http://rental_web;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host              $host;
# GHI ĐÈ chứ không nối thêm: khách không tự đặt được IP giả (xem rental-proxy-api.conf).
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_connect_timeout 5s;
proxy_read_timeout    60s;

proxy_hide_header X-Powered-By;
# Năm header nền do nginx đặt (snippet rental-security-headers.conf, kế thừa từ server); bỏ bản FE gửi để mỗi header chỉ
# có MỘT giá trị. CSP thì giữ nguyên của FE (không hide), vì chính sách CSP của trang web do FE quyết.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
