# Đặt ở /etc/nginx/snippets/rental-security-headers.conf
# `add_header` trong một location làm mất các add_header kế thừa từ server, nên file này được include ở mọi nơi cần.

# HSTS một năm. Chỉ bật sau khi HTTPS đã chạy ổn: trình duyệt nhớ và từ chối http trong suốt thời gian này.
# Thử trước bằng max-age=300. Không thêm includeSubDomains/preload nếu các subdomain khác chưa đều là HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), geolocation=(self)" always;
