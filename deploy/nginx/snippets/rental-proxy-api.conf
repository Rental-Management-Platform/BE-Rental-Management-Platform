# Đặt ở /etc/nginx/snippets/rental-proxy-api.conf. Dùng chung cho mọi location của API.
# KHÔNG cắt tiền tố /api: cookie refresh có Path=/api/v1/auth và API tự gắn tiền tố đó, nên `proxy_pass` ở đây
# không có phần đường dẫn (giữ nguyên URI gốc).

proxy_pass http://rental_api;
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
# GHI ĐÈ chứ không nối thêm ($proxy_add_x_forwarded_for): khách không tự đặt được IP giả vào chuỗi. Khớp với
# TRUST_PROXY_HOPS=1 ở .env (API lấy mục cuối cùng của chuỗi này làm IP khách).
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Nginx nhận đủ thân request rồi mới chuyển cho Node (mặc định): client chậm không giữ chân tiến trình API.
proxy_request_buffering on;

proxy_hide_header X-Powered-By;
# API đã có helmet và tự gửi một số header bảo mật giống bên dưới. Bỏ bản của API để phản hồi chỉ mang MỘT giá trị
# cho mỗi header (nginx là nơi duy nhất quyết định ở phía công khai); các header helmet khác vẫn đi qua.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Permissions-Policy;

include snippets/rental-security-headers.conf;
# Phản hồi của API là JSON hoặc ảnh, không bao giờ cần chạy script hay nhúng khung (`img-src 'self'` để mở thẳng
# một ảnh trong tab mới vẫn hiện được).
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; frame-ancestors 'none'" always;
