# Đặt ở /etc/nginx/conf.d/rental-http.conf. Cổng 80: chỉ để xin chứng chỉ và chuyển sang HTTPS.
# Đổi rental.example.com thành tên miền thật (cả ở rental-https.conf). Xóa site mặc định của nginx trước
# (`rm /etc/nginx/sites-enabled/default`), nếu không sẽ trùng `default_server`.

# Mọi request tới IP trần hoặc tên miền lạ (đây là nơi bot quét theo dải IP rơi vào): đóng kết nối, không trả nội dung
# nào, ghi vào nhật ký riêng để fail2ban khóa IP lặp lại.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/rental.blocked.log rental;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name rental.example.com;

    access_log /var/log/nginx/rental.access.log  rental if=$rental_log_normal;
    access_log /var/log/nginx/rental.blocked.log rental if=$rental_log_blocked;

    # Bot dò đường dẫn, phương thức lạ, User-Agent công cụ quét: đóng kết nối luôn, không chuyển sang https.
    if ($rental_block) {
        return 444;
    }

    # certbot (webroot) đặt tệp thử thách ở đây; đây là thứ DUY NHẤT phục vụ qua http.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
