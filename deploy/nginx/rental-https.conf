# Đặt ở /etc/nginx/conf.d/rental-https.conf, CHỈ SAU KHI đã có chứng chỉ (certbot certonly --webroot ...).
# Mô hình một tên miền: `/api/` vào BE (127.0.0.1:3000), mọi đường dẫn còn lại vào FE (127.0.0.1:3001).
# Cùng một origin nên không cần CORS, và cookie refresh (SameSite=Strict) đi đúng. Đổi cổng FE nếu khác 3001.

upstream rental_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream rental_web {
    server 127.0.0.1:3001;
    keepalive 16;
}

# TLS cho IP trần hoặc tên miền lạ (bot quét theo dải IP không biết tên miền nên rơi vào đây): từ chối bắt tay ngay,
# không để lộ chứng chỉ của site và không tốn lượt nào của ứng dụng (nginx >= 1.19.4). Việc từ chối ở tầng TLS không
# tạo dòng nhật ký truy cập nào, nên fail2ban không thấy những lượt này; chúng chỉ tốn một lần bắt tay.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    # Trên nginx >= 1.25.1 có thể đổi thành `listen 443 ssl;` cộng dòng `http2 on;` (cú pháp cũ vẫn chạy, chỉ cảnh báo).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rental.example.com;

    ssl_certificate     /etc/letsencrypt/live/rental.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rental.example.com/privkey.pem;

    # Mozilla "intermediate". Không bật ssl_stapling: Let's Encrypt đã ngừng OCSP nên chứng chỉ không còn địa chỉ OCSP.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:rental_ssl:10m;
    ssl_session_tickets off;

    # Yêu cầu bị chặn (444) vào rental.blocked.log, còn lại vào rental.access.log; fail2ban đọc cả hai.
    access_log /var/log/nginx/rental.access.log  rental if=$rental_log_normal;
    access_log /var/log/nginx/rental.blocked.log rental if=$rental_log_blocked;
    error_log  /var/log/nginx/rental.error.log warn;

    # Thân request nhỏ theo mặc định; chỉ hai route tải ảnh được nới (bên dưới).
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;

    limit_conn rental_conn 40;

    include snippets/rental-security-headers.conf;

    # Bot dò đường dẫn (tệp ẩn như .env và .git, đuôi .php, wp-login, phpmyadmin...), phương thức lạ hoặc User-Agent của
    # công cụ quét (định nghĩa ở 00-rental-zones.conf): đóng kết nối ngay, không tới Node, ghi vào rental.blocked.log.
    if ($rental_block) {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # Các route nhận mật khẩu: giới hạn chặt hơn (ứng dụng còn giới hạn riêng theo IP và email).
    location ~ ^/api/v1/auth/(register|login|forgot-password|reset-password|change-password)$ {
        limit_req zone=rental_auth burst=10 nodelay;
        include snippets/rental-proxy-api.conf;
    }

    # Hai route nhận multipart (đăng tin kèm ảnh, thêm ảnh): tối đa 5 ảnh, mỗi ảnh MAX_UPLOAD_BYTES (mặc định 5 MiB).
    # Giữ 30m nếu MAX_UPLOAD_BYTES <= 5 MiB; tăng MAX_UPLOAD_BYTES thì đặt = 5 x giá trị đó, cộng dư.
    location ~ ^/api/v1/(properties/[^/]+/listings|listings/[^/]+/images)$ {
        client_max_body_size 30m;
        client_body_timeout 60s;
        limit_req zone=rental_api burst=20 nodelay;
        include snippets/rental-proxy-api.conf;
    }

    location /api/ {
        limit_req zone=rental_api burst=40 nodelay;
        include snippets/rental-proxy-api.conf;
    }

    # Từ đây là FE (Next.js). Chính sách CSP của trang web do FE tự đặt; ở đây chỉ có các header nền ở trên. Ba mức giới
    # hạn theo độ tốn kém của yêu cầu: tệp tĩnh rẻ, trang render phía server tốn CPU của FE, tối ưu ảnh tốn nhất.
    # Nếu FE không phải Next.js thì hai location đầu vô hại (đường dẫn đó không được dùng).
    location /_next/static/ {
        # Một trang nạp hàng chục tệp cùng lúc (HTTP/2 gửi song song): burst lớn.
        limit_req zone=rental_asset burst=300 nodelay;
        include snippets/rental-proxy-web.conf;
    }

    location /_next/image {
        limit_req zone=rental_img burst=40 nodelay;
        include snippets/rental-proxy-web.conf;
    }

    # Trang và dữ liệu trang (kể cả yêu cầu tải trước liên kết của Next.js: một trang danh sách có thể bắn vài chục
    # yêu cầu một lúc, nên burst đủ rộng; bot bền bỉ thì bị giữ ở 8 yêu cầu mỗi giây).
    location / {
        limit_req zone=rental_page burst=60 nodelay;
        include snippets/rental-proxy-web.conf;
    }
}
