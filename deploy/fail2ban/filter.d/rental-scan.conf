# Đặt ở /etc/fail2ban/filter.d/rental-scan.conf
# Mỗi dòng trong /var/log/nginx/rental.blocked.log là một yêu cầu bị nginx chặn: đóng kết nối (444), hoặc 405 với phương
# thức mà nginx tự từ chối như TRACE: bot dò đường dẫn, phương thức lạ, User-Agent của công cụ quét, hoặc gõ vào IP trần
# / tên miền lạ. Dòng có dạng (log_format `rental`
# trong deploy/nginx/00-rental-zones.conf, đổi định dạng ở đó thì phải đổi regex ở đây):
#   203.0.113.5 [21/Nov/2026:07:30:46 +0000] "GET /wp-login.php HTTP/1.1" 444 0 0.000 "curl/8.12.1"
[Definition]
# Sau khi fail2ban nhận ra và cắt phần ngày giờ, dấu ngoặc vuông còn lại có thể rỗng nên dùng `[^\]]*`, không phải `+`.
failregex = ^<HOST> \[[^\]]*\] "[^"]*" (?:444|405) \d+ [\d.]+ "
ignoreregex =
