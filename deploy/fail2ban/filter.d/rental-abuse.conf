# Đặt ở /etc/fail2ban/filter.d/rental-abuse.conf
# Trong /var/log/nginx/rental.access.log: yêu cầu bị từ chối vì sai (400, 405, 414, 431), quá chậm (408), đoán đường dẫn
# (404) hoặc vượt giới hạn tần suất (429, của nginx lẫn của API). Từng dòng thì vô hại; tới ngưỡng của jail thì là bot.
#   203.0.113.5 [21/Nov/2026:07:30:46 +0000] "GET /nhieu-duong-dan-la HTTP/1.1" 404 146 0.000 "Mozilla/5.0 ..."
[Definition]
# Sau khi fail2ban nhận ra và cắt phần ngày giờ, dấu ngoặc vuông còn lại có thể rỗng nên dùng `[^\]]*`, không phải `+`.
failregex = ^<HOST> \[[^\]]*\] "[^"]*" (?:400|404|405|408|414|429|431) \d+ [\d.]+ "
# Trình thu thập của công cụ tìm kiếm có thể gặp nhiều 404 hợp lệ khi tin bị ẩn hoặc xóa: không khóa để khỏi mất SEO.
# (User-Agent giả mạo được, nhưng kẻ giả mạo chỉ được nới ngưỡng của jail này, không qua mặt được jail rental-scan.)
ignoreregex = "[^"]*(?:Googlebot|bingbot|Applebot|DuckDuckBot|Zalo)[^"]*"$
